# Copy to backup.ini ON THE SERVER. Never commit credentials.
# Relative paths are resolved against this file, not the working directory.
[backup]
output_dir = backups
local_keep = 6
snapshot_timeout_seconds = 600

[databases]
blog = ../../resources/database/blog.db
artalk = /opt/artalk/data/artalk.db

[qiniu]
bucket = YOUR_PRIVATE_BACKUP_BUCKET
prefix = blog-databases
# Reuse the server-only INI file's [qiniu] access_key and secret_key.
# Or point to a separate, chmod-600 credentials.ini with only [qiniu].
credentials_file = ../SslCertFIleDnsChallenge_TxDnsPos_to_Qiniu/config.ini
